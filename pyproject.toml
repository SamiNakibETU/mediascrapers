[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mediascrapers"
version = "0.1.0"
description = "Collectors for X timelines and online press, usable as library building blocks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sami Nakib" }]
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
mediascrapers = "mediascrapers.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mediascrapers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
